version: "3.8"

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-ai-gateway-prod
    restart: always
    expose:
      - "8000"
    environment:
      - APP_ENV=production
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - LOG_LEVEL=INFO
      - GATEWAY_API_KEY=${GATEWAY_API_KEY}
      - DATABASE_URL=postgresql://gateway_user:${POSTGRES_PASSWORD}@postgres:5432/gateway_db
      - CACHE_BACKEND=memory
      - CACHE_TTL_SECONDS=300
      - REDIS_URL=redis://redis:6379/0
      - CHEAP_MODEL_ALIAS=gpt-4o-mini
      - STRONG_MODEL_ALIAS=gpt-4o
      - FALLBACK_MODEL_ALIAS=gpt-4o
      - PROVIDER_API_KEY=${PROVIDER_API_KEY}
      - PROVIDER_BASE_URL=https://api.openai.com/v1
      - REQUEST_TIMEOUT_SECONDS=30.0
      - MAX_PROVIDER_ATTEMPTS=3
      - MAX_REQUEST_BODY_BYTES=1048576
    depends_on:
      - postgres
      - redis
    volumes:
      - gateway_logs:/app/logs

  postgres:
    image: postgres:16-alpine
    container_name: gateway-postgres
    restart: always
    environment:
      POSTGRES_DB: gateway_db
      POSTGRES_USER: gateway_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production_db_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway_user -d gateway_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gateway-redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: gateway-ingress
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/certs:/etc/nginx/certs:ro
    depends_on:
      - gateway

volumes:
  postgres_data:
  redis_data:
  gateway_logs:
